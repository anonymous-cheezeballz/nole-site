<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Title -->
  <title>Nole Protein | Proteína con tradición mexicana</title>

  <!-- Meta description -->
  <meta name="description" content="Nole Protein combina whey protein con pinole, cacao natural y azúcar orgánica. Energía moderna con tradición mexicana." />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Open Graph (for social sharing) -->
  <meta property="og:title" content="Nole Protein">
  <meta property="og:description" content="Proteína con tradición mexicana. Energía moderna con pinole, cacao natural y whey protein.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.noleprotein.com">
  <meta property="og:image" content="https://www.noleprotein.com/nole-favicon.png">

  <!-- Google indexing -->
  <meta name="robots" content="index, follow">

  <!-- Canonical -->
  <link rel="canonical" href="https://www.noleprotein.com">

  <!-- Styles -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Nole Protein",
    "description": "Proteína con tradición mexicana hecha con whey protein, pinole, cacao natural y azúcar orgánica.",
    "brand": {
      "@type": "Brand",
      "name": "Nole"
    },
    "url": "https://www.noleprotein.com",
    "image": "https://www.noleprotein.com/nole-favicon.png"
  }
  </script>
</head>
<body>

  <div class="container">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Inicio de Nole Protein">
        <img src="./assets/logo.svg" alt="Proteína Nole" />
      </a>

      <button class="nav-toggle" type="button"
        aria-label="Abrir menú"
        aria-controls="mobile-nav"
        aria-expanded="false">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>

      <nav class="nav" id="site-nav" aria-label="Principal">
        <a href="coming-soon.html">Tienda</a>
        <a href="./about.html">Nosotros</a>
        <a href="./contacto.html">Contacto</a>
      </nav>

      <div class="mobile-nav" id="mobile-nav" hidden>
        <a href="coming-soon.html">Tienda</a>
        <a href="about.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </header>
  </div>

  <div class="pattern-strip" role="presentation"></div>

  <main class="page">
    <div class="container">
      <section class="split">
        <div class="panel-left">
          <h1 class="h1">Energía moderna. Tradición Mexicana.</h1>
          <p class="lede">Polvo proteico que combina whey protein concentrate y pinole con azúcar orgánica y cacao natural, nutriendo con sabores de la tradición mexicana.</p>
          <a class="btn" href="./about.html">Conoce más</a>
        </div>

        <div class="panel-right">
          <img class="hero-media" src="./assets/product.png" alt="Maqueta del empaque de Nole Protein" />
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">&copy; <span id="year"></span> Nole</div>
      <div class="footer-right">
        <a href="mailto:contacto@noleprotein.com">contacto@noleprotein.com</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script>
  (() => {
    const btn = document.querySelector('.nav-toggle');
    const panel = document.querySelector('#mobile-nav');
    if (!btn || !panel) return;

    const close = () => {
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Abrir menú');
      document.body.classList.remove('mobile-nav-open');
    };

    const open = () => {
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      btn.setAttribute('aria-label', 'Cerrar menú');
      document.body.classList.add('mobile-nav-open');
    };

    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      isOpen ? close() : open();
    });

    panel.addEventListener('click', (e) => {
      if (e.target && e.target.matches('a')) close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });

    // Close menu when resizing up to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) close();
    });
  })();
  </script>

</body>
</html>
