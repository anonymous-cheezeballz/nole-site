<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Contáctanos para dudas sobre Nole Protein." />
  <title>Contacto — Nole Protein</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="container">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Nole Protein home">
        <img src="./assets/logo.svg" alt="Nole protein" />
      </a>

      <button class="nav-toggle" type="button"
        aria-label="Abrir menú"
        aria-controls="mobile-nav"
        aria-expanded="false">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>

      <nav class="nav" id="site-nav" aria-label="Primary">
        <a href="coming-soon.html" class="nav-link nav-link--shop">Tienda</a>
        <a href="./about.html">Nosotros</a>
        <a href="./contacto.html">Contacto</a>
      </nav>

      <div class="mobile-nav" id="mobile-nav" hidden>
        <a href="coming-soon.html">Tienda</a>
        <a href="about.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </header>
  </div>

  <div class="pattern-strip" role="presentation"></div>

  <main class="contact-page">
    <div class="container contact-inner">
      <section class="contact-card" aria-labelledby="contact-title">
        <h1 id="contact-title" class="contact-title">Contacto</h1>
        <p class="contact-copy">Cuéntanos en qué te podemos ayudar y te responderemos pronto.</p>

        <form class="contact-form" method="POST" action="PASTE_FORMSPREE_ENDPOINT_HERE">
          <input type="hidden" name="_next" value="./gracias.html" />

          <div class="form-field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required />
          </div>

          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div class="form-field">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
          </div>

          <button class="btn" type="submit">Enviar mensaje</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">© 2026 Nole</div>
      <div class="footer-right">
        <a href="mailto:contacto@noleprotein.com">contacto@noleprotein.com</a>
      </div>
    </div>
  </footer>

  <script>
  (() => {
    const btn = document.querySelector('.nav-toggle');
    const panel = document.querySelector('#mobile-nav');
    if (!btn || !panel) return;

    const close = () => {
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Abrir menú');
      document.body.classList.remove('mobile-nav-open');
    };

    const open = () => {
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      btn.setAttribute('aria-label', 'Cerrar menú');
      document.body.classList.add('mobile-nav-open');
    };

    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      isOpen ? close() : open();
    });

    panel.addEventListener('click', (e) => {
      if (e.target && e.target.matches('a')) close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });

    // Close menu when resizing up to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) close();
    });
  })();
  </script>

</body>
</html>
