<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Mensaje enviado con éxito a Nole Protein." />
  <title>Gracias — Nole Protein</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="page-gracias">

  <div class="container">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Nole Protein home">
        <img src="./assets/logo.svg" alt="Nole protein" />
      </a>

      <button class="nav-toggle" type="button"
        aria-label="Abrir menú"
        aria-controls="mobile-nav"
        aria-expanded="false">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>

      <nav class="nav" id="site-nav" aria-label="Primary">
        <a href="coming-soon.html" class="nav-link nav-link--shop">Tienda</a>
        <a href="./about.html">Nosotros</a>
        <a href="./contacto.html">Contacto</a>
      </nav>

      <div class="mobile-nav" id="mobile-nav" hidden>
        <a href="coming-soon.html">Tienda</a>
        <a href="about.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </header>
  </div>

  <div class="pattern-strip" role="presentation"></div>

  <main class="coming-soon">
    <div class="container coming-soon-inner">
      <div>
        <h1>Gracias, mensaje enviado</h1>
        <p>Recibimos tu mensaje. Te responderemos lo antes posible.</p>
        <a class="btn" href="./index.html">Volver al inicio</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">© 2026 Nole</div>
      <div class="footer-right">
        <a href="mailto:contacto@noleprotein.com">contacto@noleprotein.com</a>
      </div>
    </div>
  </footer>

  <script>
  (() => {
    const btn = document.querySelector('.nav-toggle');
    const panel = document.querySelector('#mobile-nav');
    if (!btn || !panel) return;

    const close = () => {
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Abrir menú');
      document.body.classList.remove('mobile-nav-open');
    };

    const open = () => {
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      btn.setAttribute('aria-label', 'Cerrar menú');
      document.body.classList.add('mobile-nav-open');
    };

    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      isOpen ? close() : open();
    });

    panel.addEventListener('click', (e) => {
      if (e.target && e.target.matches('a')) close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });

    // Close menu when resizing up to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) close();
    });
  })();
  </script>

</body>
</html>
